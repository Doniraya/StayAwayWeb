    <script>

        class StructuralFeatureExtractor {
            static extractFeatures(obj, graphStats, num = 0) {
                const features = [];
                features.push(num);
                // 1. Базовые признаки объекта
                features.push(obj.type === 'container' ? 1 : 0); // is_container
                //features.push(obj.type === 'warehouse_good' ? 1 : 0); // is_warehouse_good

                // 2. Локальные метрики
                const degree = graphStats.connectionMap.get(obj.id).size || 0;
                features.push(degree / Math.max(1, graphStats.maxDegree)); // normalized_degree

                const inDegree = graphStats.incomingMap.get(obj.id) || 0;
                const outDegree = graphStats.outgoingMap.get(obj.id) || 0;
                features.push(inDegree / Math.max(1, graphStats.maxInDegree)); // normalized_in_degree
                features.push(outDegree / Math.max(1, graphStats.maxOutDegree)); // normalized_out_degree

                // 3. Глобальные метрики центральности

                // PageRank-like центральность (итеративный расчет)
                const pageRank = this.calculatePageRank(obj.id, graphStats);
                features.push(pageRank); // page_rank_centrality

                // Betweenness centrality approximation
                const betweenness = this.calculateBetweennessApprox(obj.id, graphStats);
                features.push(betweenness); // betweenness_centrality

                // Closeness centrality approximation  
                const closeness = this.calculateClosenessApprox(obj.id, graphStats);
                features.push(closeness); // closeness_centrality

                // 4. Структурные коэффициенты

                // Коэффициент кластеризации (насколько соседи связаны между собой)
                const clusteringCoeff = this.calculateClusteringCoefficient(obj.id, graphStats);
                features.push(clusteringCoeff); // clustering_coefficient

                // Эго-сеть характеристики
                const egoNetwork = this.getEgoNetwork(obj.id, graphStats, 2); // 2 шага
                features.push(egoNetwork.size / Math.max(1, graphStats.totalObjects)); // ego_network_size
                features.push(egoNetwork.density); // ego_network_density
                features.push(egoNetwork.diameter / 10); // ego_network_diameter (нормализовано)

                // 5. Иерархические признаки
                const hierarchyLevel = this.calculateHierarchyLevel(obj.id, graphStats);
                features.push(hierarchyLevel / 3); // normalized_hierarchy_level (0-3 уровней)

                const isSource = (inDegree === 0 && outDegree > 0) ? 1 : 0;
                const isSink = (outDegree === 0 && inDegree > 0) ? 1 : 0;
                const isIntermediate = (inDegree > 0 && outDegree > 0) ? 1 : 0;
                features.push(isSource, isSink, isIntermediate);

                // 6. Ролевые признаки (структурная эквивалентность)
                const structuralRole = this.calculateStructuralRole(obj.id, graphStats);
                features.push(...structuralRole); // 4 признака роли

                return features.slice(0, 20); // 20 структурных признаков
            }

            // Упрощенный PageRank (без внешних зависимостей)
            static calculatePageRank(nodeId, graphStats) {
                // Используем итеративный подход с фиксированным числом итераций
                const damping = 0.85;
                const iterations = 10;
                const nodes = Array.from(graphStats.allNodeIds);

                if (nodes.length === 0) return 0;

                let pageRank = {};
                nodes.forEach(node => pageRank[node] = 1 / nodes.length);

                for (let iter = 0; iter < iterations; iter++) {
                    let newPageRank = {};
                    nodes.forEach(node => newPageRank[node] = (1 - damping) / nodes.length);

                    nodes.forEach(fromNode => {
                        const neighbors = graphStats.connectionMap.get(fromNode) || new Set();
                        if (neighbors.size > 0) {
                            const contribution = damping * pageRank[fromNode] / neighbors.size;
                            neighbors.forEach(toNode => {
                                newPageRank[toNode] = (newPageRank[toNode] || 0) + contribution;
                            });
                        }
                    });

                    pageRank = newPageRank;
                }

                return pageRank[nodeId] || 0;
            }

            // Приближенная betweenness centrality
            static calculateBetweennessApprox(nodeId, graphStats) {
                const nodes = Array.from(graphStats.allNodeIds);
                if (nodes.length < 3) return 0;

                const sampleSize = Math.min(20, nodes.length * 2);
                let betweenness = 0;
                let totalPairs = 0;

                for (let i = 0; i < sampleSize; i++) {
                    const source = nodes[Math.floor(Math.random() * nodes.length)];
                    let target;
                    do {
                        target = nodes[Math.floor(Math.random() * nodes.length)];
                    } while (target === source);

                    if (source !== nodeId && target !== nodeId) {
                        const paths = this.findAllShortestPaths(source, target, graphStats);
                        if (paths.length > 0) {
                            const pathsThroughNode = paths.filter(path => path.includes(nodeId));
                            betweenness += pathsThroughNode.length / paths.length;
                            totalPairs++;
                        }
                    }
                }

                return totalPairs > 0 ? betweenness / totalPairs : 0;
            }

            // Приближенная closeness centrality  
            static calculateClosenessApprox(nodeId, graphStats) {
                const nodes = Array.from(graphStats.allNodeIds);
                if (nodes.length <= 1) return 0;

                const sampleSize = Math.min(30, nodes.length);
                let totalDistance = 0;
                let reachableCount = 0;

                for (let i = 0; i < sampleSize; i++) {
                    const target = nodes[Math.floor(Math.random() * nodes.length)];
                    if (target !== nodeId) {
                        const distance = this.shortestPathDistance(nodeId, target, graphStats);
                        if (distance < Infinity) {
                            totalDistance += distance;
                            reachableCount++;
                        }
                    }
                }

                return reachableCount > 0 ? reachableCount / (totalDistance + reachableCount) : 0;
            }

            // Коэффициент кластеризации
            static calculateClusteringCoefficient(nodeId, graphStats) {
                const neighbors = graphStats.connectionMap.get(nodeId) || new Set();
                if (neighbors.size < 2) return 0;

                let actualConnections = 0;
                const neighborArray = Array.from(neighbors);

                for (let i = 0; i < neighborArray.length; i++) {
                    for (let j = i + 1; j < neighborArray.length; j++) {
                        const neighborNeighbors = graphStats.connectionMap.get(neighborArray[i]) || new Set();
                        if (neighborNeighbors.has(neighborArray[j])) {
                            actualConnections++;
                        }
                    }
                }

                const possibleConnections = (neighbors.size * (neighbors.size - 1)) / 2;
                return possibleConnections > 0 ? actualConnections / possibleConnections : 0;
            }

            // Эго-сеть (локальное окружение)
            static getEgoNetwork(nodeId, graphStats, depth = 2) {
                const network = new Set([nodeId]);
                const queue = [{ node: nodeId, depth: 0 }];
                const visited = new Set([nodeId]);

                while (queue.length > 0) {
                    const { node, currentDepth } = queue.shift();

                    if (currentDepth < depth) {
                        const neighbors = graphStats.connectionMap.get(node) || new Set();
                        neighbors.forEach(neighbor => {
                            if (!visited.has(neighbor)) {
                                visited.add(neighbor);
                                network.add(neighbor);
                                queue.push({ node: neighbor, depth: currentDepth + 1 });
                            }
                        });
                    }
                }

                // Рассчитываем плотность эго-сети
                let connections = 0;
                const networkArray = Array.from(network);

                networkArray.forEach(node => {
                    const neighbors = graphStats.connectionMap.get(node) || new Set();
                    neighbors.forEach(neighbor => {
                        if (network.has(neighbor)) {
                            connections++;
                        }
                    });
                });

                const maxPossible = network.size * (network.size - 1);
                const density = maxPossible > 0 ? connections / maxPossible : 0;

                // Диаметр эго-сети
                let maxDistance = 0;
                networkArray.forEach(node1 => {
                    networkArray.forEach(node2 => {
                        if (node1 !== node2) {
                            const dist = this.shortestPathDistance(node1, node2, graphStats);
                            if (dist < Infinity) {
                                maxDistance = Math.max(maxDistance, dist);
                            }
                        }
                    });
                });

                return {
                    size: network.size,
                    density: density,
                    diameter: maxDistance
                };
            }

            // Уровень иерархии
            static calculateHierarchyLevel(nodeId, graphStats) {
                const inDegree = graphStats.incomingMap.get(nodeId) || 0;
                const outDegree = graphStats.outgoingMap.get(nodeId) || 0;

                if (inDegree === 0 && outDegree > 0) return 0; // источник (верх)
                if (outDegree === 0 && inDegree > 0) return 2; // сток (низ)
                if (inDegree > 0 && outDegree > 0) return 1; // промежуточный
                return 1; // изолированный
            }

            // Структурная роль (упрощенная)
            static calculateStructuralRole(nodeId, graphStats) {
                const inDegree = graphStats.incomingMap.get(nodeId) || 0;
                const outDegree = graphStats.outgoingMap.get(nodeId) || 0;
                const totalDegree = inDegree + outDegree;

                // 4 типа ролей:
                const role = [0, 0, 0, 0];
                const threshold = Math.max(1, graphStats.avgDegree * 1.5);

                if (outDegree > threshold && inDegree < threshold * 0.5) {
                    role[0] = 1; // источник
                } else if (inDegree > threshold && outDegree < threshold * 0.5) {
                    role[1] = 1; // сток
                } else if (totalDegree > threshold * 1.5) {
                    role[2] = 1; // хаб
                } else {
                    role[3] = 1; // периферийный
                }

                return role;
            }

            // Вспомогательные методы для поиска путей
            static shortestPathDistance(from, to, graphStats) {
                if (from === to) return 0;

                const queue = [{ node: from, distance: 0 }];
                const visited = new Set([from]);

                while (queue.length > 0) {
                    const { node, distance } = queue.shift();
                    const neighbors = graphStats.connectionMap.get(node) || new Set();

                    for (const neighbor of neighbors) {
                        if (neighbor === to) return distance + 1;
                        if (!visited.has(neighbor)) {
                            visited.add(neighbor);
                            queue.push({ node: neighbor, distance: distance + 1 });
                        }
                    }
                }

                return Infinity;
            }

            static findAllShortestPaths(from, to, graphStats) {
                // Реализация поиска всех кратчайших путей с использованием BFS
                if (from === to) return [[from]];

                const queue = [[from]];
                const visited = new Set();
                const allPaths = [];
                let shortestLength = Infinity;
                const distances = new Map();
                distances.set(from, 0);

                while (queue.length > 0) {
                    const path = queue.shift();
                    const node = path[path.length - 1];
                    const currentDistance = distances.get(node) || 0;

                    // Если уже нашли пути и текущий путь длиннее, пропускаем
                    if (allPaths.length > 0 && currentDistance >= shortestLength) {
                        continue;
                    }

                    const neighbors = graphStats.connectionMap.get(node) || new Set();

                    for (const neighbor of neighbors) {
                        if (neighbor === to) {
                            const newPath = [...path, neighbor];
                            allPaths.push(newPath);
                            shortestLength = Math.min(shortestLength, newPath.length);
                        } else if (!visited.has(neighbor) || distances.get(neighbor) >= currentDistance + 1) {
                            // Разрешаем посещать узел, если нашли путь той же или меньшей длины
                            if (!distances.has(neighbor) || distances.get(neighbor) > currentDistance + 1) {
                                distances.set(neighbor, currentDistance + 1);
                                visited.delete(neighbor); // Удаляем из visited если нашли более короткий путь
                            }
                            const newPath = [...path, neighbor];
                            queue.push(newPath);
                            if (!visited.has(neighbor)) {
                                visited.add(neighbor);
                            }
                        }
                    }
                }

                return allPaths;
            }
        
        
        }

</script>


    <script>

        // Основной класс визуализатора графа
        class GraphVisualizer {
            constructor(canvasId, debug = false, radius = 6, OptimalLineOffsetCell = 2, OptimallineWidthCell = 2, cellSize = 25) {
                this.debug = debug;
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');

                this.allpath = [];

                this.containerHeight = 200;
                this.goodsSize = 150;

                this.offsetY = 0;

                this.isDragging = false;
                this.lastMouseX = 0;
                this.lastMouseY = 0;

                // Данные
                this.containers = [];
                this.warehouseGoods = [];
                this.joins = [];
                this.allNodes = []; // Все узлы для отрисовки и обработки событий

                this.initCanvasSize();
                this.setupEventListeners();
                // Создаем потенциальное поле
                this.fieldWidth = this.canvas.width * 2;
                this.fieldHeight = this.canvas.height * 2;
                //const cellSize = 25;
                this.potentialField = new PotentialField(this.fieldWidth, this.fieldHeight, cellSize);
                this.radius = radius;
                this.OptimalLineOffsetCell = OptimalLineOffsetCell;
                this.OptimallineWidthCell = OptimallineWidthCell;

                this.neuralNetwork = new SimpleNeuralNetwork(20, 500, 2);
                //this.graphStats = GraphAnalyzer.analyzeGraph(data);
                //this.allObjects = GraphAnalyzer.getAllObjects(data);

            }

            initCanvasSize() {
                this.canvas.width = window.innerWidth - 40;
                this.canvas.height = window.innerHeight - 40;
                this.render();
            }

            setupEventListeners() {
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', () => this.handleMouseUp());
                this.canvas.addEventListener('wheel', (e) => this.handleWheel(e));
                this.canvas.addEventListener('click', (e) => this.handleClick(e));
                this.canvas.addEventListener('dblclick', (e) => this.handleDblclick(e));
                this.canvas.addEventListener('mouseover', (e) => this.showTooltip(e));
                this.canvas.addEventListener('mouseout', () => this.hideTooltip());
                //this.canvas.addEventListener('resize', () => this.handleresize());

                // Обработчики для сенсорных устройств
                this.canvas.addEventListener('touchstart', (e) => this.handleTouchStart(e));
                this.canvas.addEventListener('touchmove', (e) => this.handleTouchMove(e));
                this.canvas.addEventListener('touchend', (e) => this.handleTouchEnd(e));
                this.canvas.addEventListener('touchcancel', (e) => this.handleTouchEnd(e));



                window.addEventListener('resize', () => this.initCanvasSize());
            }

            setData(data) {
                this.containers = [];
                this.warehouseGoods = [];
                this.joins = data.joins || [];
                this.allNodes = [];
                this.nodeMap = {};

                // Создаем контейнеры
                if (data.containers) {
                    data.containers.forEach(containerData => {
                        const container = new Container(
                            containerData.id,
                            containerData.title,
                            containerData.isotype,
                            containerData.weight,
                            containerData.place,
                            containerData.ref,
                            containerData.tooltip
                        );

                        // Добавляем грузы в контейнер
                        if (containerData.goods) {
                            containerData.goods.forEach(goodData => {
                                const good = new Good(
                                    goodData.id,
                                    goodData.title,
                                    goodData.ref,
                                    goodData.weight,
                                    goodData.place,
                                    'container_good',
                                    goodData.tooltip
                                );
                                container.addGood(good);
                                this.nodeMap[good.id] = good;
                                this.allNodes.push(good);
                            });
                        }

                        this.containers.push(container);
                        this.nodeMap[container.id] = container;
                        this.allNodes.push(container);
                    });
                }

                // Создаем грузы на складе
                if (data.goods) {
                    data.goods.forEach(goodData => {
                        const good = new Good(
                            goodData.id,
                            goodData.title,
                            goodData.ref,
                            goodData.weight,
                            goodData.place,
                            'warehouse_good',
                            goodData.tooltip
                        );
                        good.width = this.goodsSize;
                        this.warehouseGoods.push(good);
                        this.nodeMap[good.id] = good;
                        this.allNodes.push(good);
                    });
                }

                // Обработка соединений
                this.joins.forEach(join => {
                    if (this.nodeMap[join.from] && this.nodeMap[join.to]) {
                        this.nodeMap[join.from].outgoing.push({
                            to: join.to,
                            text: join.text,
                            fromNode: this.nodeMap[join.from],
                            toNode: this.nodeMap[join.to]
                        });
                        this.nodeMap[join.to].incoming.push({
                            from: join.from,
                            text: join.text,
                            fromNode: this.nodeMap[join.from],
                            toNode: this.nodeMap[join.to]
                        });
                    }
                });


                this.graphStats = GraphAnalyzer.analyzeGraph(data);
                this.allObjects = GraphAnalyzer.getAllObjects(data);

                this.layoutGraph();
                this.render();
            }

            applyPotentialFieldLayout() {
                this.layoutGraph();
                //this.statusElement.textContent = 'Расстановка применена с помощью ПП!';
                this.render();
            }

            trainNetwork() {
                const rootObjects = [];

                // Собираем только корневые объекты (не вложенные в контейнеры)
                this.containers.forEach(container => {
                    rootObjects.push(container);
                });
                this.warehouseGoods.forEach(good => {
                    rootObjects.push(good);
                });

                rootObjects.sort((a, b) => a.getLineCount() - b.getLineCount());

                const epochs = 5000;
                const learningRate = 0.001;

                for (let epoch = 0; epoch < epochs; epoch++) {
                    let totalError = 0;

                    // Перемешиваем данные
                    //this.shuffleArray(this.trainingData);

                    rootObjects.forEach((obj, index) => {
                        let num = index / rootObjects.length;
                        const features = StructuralFeatureExtractor.extractFeatures(obj, this.graphStats, num);

                        let target = [obj.x / this.canvas.width, obj.y / this.canvas.height];
                        this.neuralNetwork.train(features, target, learningRate);

                        // Подсчет ошибки для отображения прогресса
                        const prediction = this.neuralNetwork.forward(features);
                        const error = Math.pow(prediction[0] - target[0], 2) +
                            Math.pow(prediction[1] - target[1], 2);
                        totalError += error;
                    });

                    if (epoch % 100 === 0) {
                        console.log(`Epoch ${epoch}, Average Error: ${totalError / rootObjects.length}`);
                    }
                }


            }

            applyNeuralLayout() {
                // Собираем объекты верхнего уровня
                const rootObjects = [];

                // Собираем только корневые объекты (не вложенные в контейнеры)
                this.containers.forEach(container => {
                    rootObjects.push(container);
                });
                this.warehouseGoods.forEach(good => {
                    rootObjects.push(good);
                });

                rootObjects.sort((a, b) => a.getLineCount() - b.getLineCount());

                // Применяем предсказания нейросети
                rootObjects.forEach((obj, index) => {
                    let num = index / rootObjects.length;
                    const features = StructuralFeatureExtractor.extractFeatures(obj, this.graphStats, num);
                    const prediction = this.neuralNetwork.forward(features);

                    obj.x = prediction[0] * this.canvas.width;
                    obj.y = prediction[1] * this.canvas.height;
                    if (obj instanceof Container) {
                        obj.layoutGoods();
                    }

                });

                //this.statusElement.textContent = 'Расстановка применена с помощью нейросети!';
                this.render();
            }

            layoutGraph() {

                //if(this.containers.length<3&&this.warehouseGoods.length<4)return this.OldlayoutGraph();
                // Собираем только корневые объекты (не вложенные в контейнеры)
                const rootObjects = [];
                const placedObjects = [];
                this.containers.forEach(container => {
                    rootObjects.push(container);
                });
                this.warehouseGoods.forEach(good => {
                    rootObjects.push(good);
                });




                let obj = null;

                // Сортируем по количеству соединений (убывание)
                rootObjects.sort((a, b) => a.getLineCount(obj) - b.getLineCount(obj));

                // Размещаем первый объект в центре
                // if (rootObjects.length > 0) {
                obj = rootObjects.pop();//[0];

                // this.fieldWidth = this.canvas.width * 2;
                // this.fieldHeight = this.canvas.height * 2;
                let centerdiv = 2;
                const centerX = this.fieldWidth / centerdiv;//debug 2
                const centerY = this.fieldHeight / centerdiv;
                obj.x = centerX - obj.width / centerdiv;
                obj.y = centerY - obj.height / centerdiv;
                placedObjects.push(obj);
                // Добавляем влияние первого объекта на поле
                //potentialField.addObjectInfluence(centerX, centerY, 100);

                // Обновляем позиции грузов внутри контейнера
                if (obj instanceof Container) {
                    obj.layoutGoods();
                }
                let obj2 = obj;
                let areaObjects = rootObjects.concat();
                // Размещаем остальные объекты
                while (rootObjects.length > 0)
                // for (let i = 0; i < rootObjects.length; i++) 
                {

                    let area = areaObjects.reduce((accumulator, currentValue) => { accumulator += obj.isConnectedTo(currentValue) ? currentValue.width * currentValue.height : 0; return accumulator; }, obj.width * obj.height);

                    let OptimalLineOffsetCell = Math.round(Math.sqrt(area) / this.potentialField.cellSize);
                    let params = { OptimalLineOffsetCell: this.OptimalLineOffsetCell + OptimalLineOffsetCell, OptimallineWidthCell: this.OptimallineWidthCell, radius: this.radius + OptimalLineOffsetCell, centralobj: obj };
                    rootObjects.sort((a, b) => (a.getLineCount(obj) + a instanceof Container ? 1 : 0) - (b.getLineCount(obj) + b instanceof Container ? 1 : 0));
                    if (!obj.isConnectedTo(rootObjects[rootObjects.length - 1])) {
                        rootObjects.sort((a, b) => a.getLineCount(obj2) - b.getLineCount(obj2));
                        obj = obj2;
                    }


                    obj2 = rootObjects.pop();//[i];
                    this.potentialField.init(obj2, placedObjects, params);

                    // Находим лучшую позицию с минимальным потенциалом
                    const bestPos = this.potentialField.findBestPosition(obj2.width, obj2.height);
                    obj2.x = bestPos.x - obj2.width / 2;
                    obj2.y = bestPos.y - obj2.height / 2;
                    placedObjects.push(obj2);
                    if (this.debug) this.render();//debug
                    // Добавляем влияние этого объекта на поле
                    //potentialField.addObjectInfluence(bestPos.x, bestPos.y, 100);

                    // Обновляем позиции грузов внутри контейнера
                    if (obj2 instanceof Container) {
                        obj2.layoutGoods();
                    }
                    //  if(obj2.title=="CAIU2572630")break;
                }
                //uf(this.debug)return;
                // Корректируем координаты относительно центра холста
                //return;

                this.normalizeLayout(placedObjects);

            }


            normalizeLayout(placedObjects) {
                const minX = Math.min(...placedObjects.map(obj => obj.x));
                const minY = Math.min(...placedObjects.map(obj => obj.y));
                const offset = 20; // Отступ от края

                /*
                                placedObjects.forEach(obj => {
                                    obj.x = obj.x - minX + offset;
                                    obj.y = obj.y - minY + offset;
                
                                    if (obj instanceof Container) {
                                        obj.layoutGoods();
                                    }
                                });
                                */

                const maxX = Math.max(...placedObjects.map(obj => obj.x + obj.width)) - minX + offset;
                const maxY = Math.max(...placedObjects.map(obj => obj.y + obj.height)) - minY + offset;

                //this.scale = 0.71;
                let sx = maxX > 0 ? this.canvas.width / maxX : 1;
                let sy = maxY > 0 ? this.canvas.height / maxY : 1;
                this.scale = Math.min(sx, sy, 1);
                this.offsetX = -(minX - offset) * this.scale;
                this.offsetY = -(minY - offset) * this.scale;
            }

            useCoord(x, y, r, o) {
                let c2d = new Circle2D(x, y, r, o);
                c2d.draw(this.ctx);
                this.usedCoord.push(c2d);
            }

            whCoordUsed(x, y, r) {

                for (let v of this.usedCoord) {
                    let xx = v.v.x - x;
                    let yy = v.v.y - y;
                    let rr = Math.sqrt(xx * xx + yy * yy);
                    v.draw(this.ctx);
                    if ((rr - v.r) < r) {//выталкивание одного кружочка из другого

                        let s = 1;

                        if ((v.r + r) != 0) s = 5 * ((v.r + r) - rr) / (v.r + r);
                        return new Vector2D(xx * s, yy * s);
                    }


                }
                return null;

            }

            render() {
                this.usedCoord = [];
                this.allpath = [];
                this.textlabels = [];
                this.virtualBlocks = [];
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.save();
                this.ctx.translate(this.offsetX, this.offsetY);
                this.ctx.scale(this.scale, this.scale);

                // Отрисовываем все объекты (контейнеры и грузы)
                this.renderObjects();

                // Отрисовываем соединения ПОСЛЕ всех объектов (на переднем плане)
                this.renderJoins();
                if (this.potentialField && this.debug) this.potentialField.draw(this.ctx);
                this.ctx.restore();
            }

            renderObjects() {
                // Отрисовываем контейнеры
                this.containers.forEach(container => {
                    container.render(this.ctx);
                    let centerX = container.x + container.width / 2;
                    let centerY = container.y + container.height / 2;
                    this.useCoord(centerX, centerY, container.height / 2, container);
                    //this.virtualBlocks.push([new Vector2D(container.x, container.y),new Vector2D(container.x + container.width , container.y + container.headerHeight)]);

                    for (let i = 5; i > 0; i--)
                        this.useCoord(container.x + i * container.width / 5 - container.headerHeight / 2, container.y + container.headerHeight / 2, container.headerHeight / 2, container);
                });

                // Отрисовываем грузы на складе
                this.warehouseGoods.forEach(good => {
                    good.render(this.ctx, false);
                    let centerX = good.x + good.width / 2;
                    let centerY = good.y + good.height / 2;
                    this.useCoord(centerX, centerY, good.height / 2, good);
                });

                // Отрисовываем грузы внутри контейнеров
                this.containers.forEach(container => {
                    container.goods.forEach(good => {
                        good.render(this.ctx, true);
                        let centerX = good.x + good.width / 2;
                        let centerY = good.y + good.height / 2;
                        this.useCoord(centerX, centerY, good.width / 2, good);
                    });
                });
            }

            renderJoins() {
                // Сохраняем текущее состояние контекста
                this.ctx.save();
                // Создаем экземпляр PathFinder с текущими объектами
                const pathFinder = new PathFinder(this.allNodes);
                // Устанавливаем параметры для линий
                this.ctx.lineWidth = 3;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                //pathFinder.drawGrid(this.ctx);
                this.joins.forEach(join => {
                    if (!this.nodeMap[join.from] || !this.nodeMap[join.to]) return;

                    const fromNode = this.nodeMap[join.from];
                    const toNode = this.nodeMap[join.to];

                    // Получаем точки соединения
                    const fromPoint = fromNode.getConnectorPoint(toNode);
                    const toPoint = toNode.getConnectorPoint(fromNode);
                    this.useCoord(fromPoint.x, fromPoint.y, 10, toNode);
                    this.useCoord(toPoint.x, toPoint.y, 10, fromNode);
                    join.len = fromPoint.subtract(toPoint).len();
                });

                // Сортируем узлы по уровням
                this.joins.sort((a, b) => a.len - b.len);

                // Рисуем каждое соединение с поиском путей алгоритмом дейкстры
                this.joins.forEach(join => {
                    if (!this.nodeMap[join.from] || !this.nodeMap[join.to]) return;

                    const fromNode = this.nodeMap[join.from];
                    const toNode = this.nodeMap[join.to];

                    // Получаем точки соединения
                    let fromPoint = new Vector2D(fromNode.x + fromNode.width / 2, fromNode.y + fromNode.height / 2);
                    let toPoint = new Vector2D(toNode.x + toNode.width / 2, toNode.y + toNode.height / 2);

                    // Используем алгоритм Дейкстры для поиска пути обхода препятствий
                    const path = pathFinder.findPath(fromPoint, toPoint, fromNode, toNode, this.virtualBlocks);
                    this.allpath.concat(path);
                    const simplifiedPath = pathFinder.simplifyPath(path, 8, fromNode, toNode);
                    if (path.length == 2) {
                        fromPoint = fromNode.getConnectorPoint(toNode);
                        toPoint = toNode.getConnectorPoint(fromNode);

                        this.drawCurvedLine(fromPoint, toPoint, join);
                    } else {
                        // Рисуем линию по найденному пути
                        this.drawPathWithCurves(simplifiedPath, join);
                    }
                });

                //pathFinder.drawGrid(this.ctx);
                // Восстанавливаем состояние контекста
                this.ctx.restore();
            }

            findPoint(mid, r, occupy = true, o = undefined) {
                let usebezierCurveTo = true;
                for (let i = 5; i > 0; i--) {
                    let used = this.whCoordUsed(mid.x, mid.y, r);
                    if (used == null) { break; }
                    else {
                        mid.x -= used.x;
                        mid.y -= used.y;
                        usebezierCurveTo = false;

                    }
                }
                if (occupy) this.useCoord(mid.x, mid.y, r, o);

                return usebezierCurveTo;

            }
            //с поиском пути по дейкстра
            drawPathWithCurves(path, join) {
                if (path.length < 2) return;

                // Добавляем тень для лучшей видимости
                this.ctx.shadowColor = 'rgba(0,0,0,0.3)';
                this.ctx.shadowBlur = 4;
                this.ctx.shadowOffsetX = 0;
                this.ctx.shadowOffsetY = 2;

                // Начинаем путь
                this.ctx.beginPath();
                this.ctx.moveTo(path[0].x, path[0].y);

                // Рисуем кривые между точками
                for (let i = 1; i < path.length; i++) {
                    if (i === 1) {
                        this.ctx.lineTo(path[i].x, path[i].y);
                    } else {
                        // Используем кривые Безье для плавных переходов
                        let p = 1;
                        if (i == path.length - 2) p = 2;
                        const prev = path[i - 2];
                        const curr = path[i - 1];
                        const next = path[i];

                        // Контрольные точки для плавной кривой
                        const cp1x = curr.x;
                        const cp1y = curr.y;
                        const cp2x = curr.x + (next.x - prev.x) * 0.1;
                        const cp2y = curr.y + (next.y - prev.y) * 0.1;
                        this.ctx.quadraticCurveTo(cp1x, cp1y, next.x, next.y);
                        //this.ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, next.x, next.y);
                    }
                }


                // Устанавливаем стиль линии
                this.ctx.strokeStyle = '#FF5722'; // Яркий оранжевый цвет
                this.ctx.lineWidth = 3;
                this.ctx.stroke();

                // Отключаем тень для стрелки и текста
                this.ctx.shadowColor = 'transparent';
                this.ctx.shadowBlur = 0;

                // Рисуем стрелку на конце
                if (path.length >= 2) {
                    const lastPoint = path[path.length - 1];
                    const prevPoint = path[path.length - 2];
                    this.drawArrowHead(lastPoint.x, lastPoint.y, prevPoint.x, prevPoint.y);
                }

                // Находим середину пути для текста
                let totalLength = 0;
                let segments = [];

                for (let i = 1; i < path.length; i++) {
                    const segmentLength = Math.sqrt(
                        Math.pow(path[i].x - path[i - 1].x, 2) +
                        Math.pow(path[i].y - path[i - 1].y, 2)
                    );
                    segments.push({
                        start: path[i - 1],
                        end: path[i],
                        length: segmentLength
                    });
                    totalLength += segmentLength;
                }

                const midLength = totalLength / 2;
                let currentLength = 0;
                let midPoint = { x: path[0].x, y: path[0].y };

                for (let i = 0; i < segments.length; i++) {
                    if (currentLength + segments[i].length >= midLength) {
                        const ratio = (midLength - currentLength) / segments[i].length;
                        midPoint = {
                            x: segments[i].start.x + ratio * (segments[i].end.x - segments[i].start.x),
                            y: segments[i].start.y + ratio * (segments[i].end.y - segments[i].start.y)
                        };
                        break;
                    }
                    currentLength += segments[i].length;
                }


                // Размеры прямоугольника с текстом
                const textWidth = this.ctx.measureText(join.text).width + 12;
                const textHeight = 22;
                this.findPoint(midPoint, textHeight / 2, true, join.text);
                let t = new LineText(join.fromNode, join.toNode, join.text, midPoint.x, midPoint.y, textWidth, textHeight);
                t.draw(this.ctx);
                this.virtualBlocks.push([new Vector2D(midPoint.x - textWidth / 2, midPoint.y - textHeight / 2), new Vector2D(midPoint.x - textWidth / 2 + textWidth, midPoint.y - textHeight / 2 + textHeight)]);
                this.textlabels.push(t);

            }
            //без поиска пути просто в лоб кривая чуть чуть уворачивается от некоторых объектов
            drawCurvedLine(fromPoint, toPoint, join) {

                // Добавляем тень для лучшей видимости
                this.ctx.shadowColor = 'rgba(0,0,0,0.3)';
                this.ctx.shadowBlur = 4;
                this.ctx.shadowOffsetX = 0;
                this.ctx.shadowOffsetY = 2;



                // Вычисляем контрольные точки для кривой Безье
                let mid = fromPoint.centerBetween(toPoint);
                //let midX = (fromPoint.x + toPoint.x) / 2;
                //let midY = (fromPoint.y + toPoint.y) / 2;

                const dx = toPoint.x - fromPoint.x;
                const dy = toPoint.y - fromPoint.y;

                let cp1, cp2;

                // Разные коэффициенты для вертикальных и горизонтальных линий
                if (Math.abs(dy) > Math.abs(dx)) {
                    // Преимущественно вертикальная линия
                    cp1 = new Vector2D(fromPoint.x + dx * 0.3, fromPoint.y + dy * 0.1);
                    cp2 = new Vector2D(fromPoint.x + dx * 0.7, toPoint.y - dy * 0.1);
                } else {
                    // Преимущественно горизонтальная линия
                    cp1 = new Vector2D(fromPoint.x + dx * 0.1, fromPoint.y + dy * 0.3);
                    cp2 = new Vector2D(fromPoint.x + dx * 0.1, toPoint.y - dy * 0.7);
                }

                this.findPoint(cp2, 5, false);
                this.findPoint(cp1, 5, false);

                // Размеры прямоугольника с текстом
                const textWidth = this.ctx.measureText(join.text).width + 12;
                const textHeight = 22;
                let usebezierCurveTo = this.findPoint(mid, textWidth / 2, true, join.text);

                if (usebezierCurveTo == false) {
                    cp2 = mid.centerBetween(toPoint);
                    this.findPoint(cp2, 5, false);
                }

                // Начинаем путь
                this.ctx.beginPath();
                this.ctx.moveTo(fromPoint.x, fromPoint.y);


                // Рисуем кривую Безье
                if (usebezierCurveTo) {
                    this.ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, toPoint.x, toPoint.y);
                }
                else {
                    this.ctx.quadraticCurveTo(cp1.x, cp1.y, mid.x, mid.y);
                    this.ctx.quadraticCurveTo(cp2.x, cp2.y, toPoint.x, toPoint.y);
                }

                // Устанавливаем стиль линии
                this.ctx.strokeStyle = '#FF5722'; // Яркий оранжевый цвет
                this.ctx.lineWidth = 3;
                this.ctx.stroke();

                // Отключаем тень для стрелки и текста
                this.ctx.shadowColor = 'transparent';
                this.ctx.shadowBlur = 0;

                // Рисуем стрелку на конце
                cp2 = mid.centerBetween(cp2);
                this.drawArrowHead(toPoint.x, toPoint.y, cp2.x, cp2.y);

                let t = new LineText(join.fromNode, join.toNode, join.text, mid.x, mid.y, textWidth, textHeight);
                t.draw(this.ctx);
                this.virtualBlocks.push([new Vector2D(mid.x - textWidth / 2, mid.y - textHeight / 2), new Vector2D(mid.x - textWidth / 2 + textWidth, mid.y - textHeight / 2 + textHeight)]);
                this.textlabels.push(t);


            }

            drawArrowHead(x, y, fromX, fromY) {
                // Вектор от предыдущей точки к текущей
                const dx = x - fromX;
                const dy = y - fromY;
                const length = Math.sqrt(dx * dx + dy * dy);

                // Если длина слишком мала, не рисуем стрелку
                if (length < 1) return;

                // Нормализуем вектор
                const normDx = dx / length;
                const normDy = dy / length;

                // Длина и ширина стрелки
                const arrowLength = 15;
                const arrowWidth = 5;

                // Точки стрелки
                const x1 = x;
                const y1 = y;
                const x2 = x - arrowLength * normDx - arrowWidth * normDy;
                const y2 = y - arrowLength * normDy + arrowWidth * normDx;
                const x3 = x - arrowLength * normDx + arrowWidth * normDy;
                const y3 = y - arrowLength * normDy - arrowWidth * normDx;

                // Рисуем стрелку
                this.ctx.beginPath();
                this.ctx.moveTo(x1, y1);
                this.ctx.lineTo(x2, y2);
                this.ctx.lineTo(x3, y3);
                this.ctx.closePath();

                this.ctx.fillStyle = '#FF5722'; // Яркий оранжевый цвет
                this.ctx.fill();

                // Добавляем обводку для лучшей видимости
                this.ctx.strokeStyle = '#FF5722';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
            }

            handleMouseDown(e) {
                e.preventDefault();
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - this.offsetX) / this.scale;
                const mouseY = (e.clientY - rect.top - this.offsetY) / this.scale;

                // Проверяем, попали ли в какой-либо объект для перетаскивания
                let foundObject = null;
                for (let i = this.allNodes.length - 1; i >= 0; i--) {
                    const node = this.allNodes[i];
                    if (node && node.containsPoint(mouseX, mouseY)) {
                        foundObject = node;
                        break;
                    }
                }

                if (foundObject) {
                    // Начинаем перетаскивание объекта
                    this.draggedObject = foundObject;
                    foundObject.startDrag(mouseX, mouseY);
                    this.canvas.style.cursor = 'grabbing';
                } else {
                    // Начинаем перетаскивание холста
                    this.isDraggingCanvas = true;
                    this.lastMouseX = e.clientX - rect.left;
                    this.lastMouseY = e.clientY - rect.top;
                    this.canvas.style.cursor = 'grabbing';
                }

                this.render();
            }

            handleMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - this.offsetX) / this.scale;
                const mouseY = (e.clientY - rect.top - this.offsetY) / this.scale;
                const canvasMouseX = e.clientX - rect.left;
                const canvasMouseY = e.clientY - rect.top;

                if (this.draggedObject) {
                    // Перетаскиваем объект
                    this.draggedObject.updateDrag(mouseX, mouseY, this.allNodes);
                    this.render();
                } else if (this.isDraggingCanvas) {
                    // Перетаскиваем холст
                    const dx = canvasMouseX - this.lastMouseX;
                    const dy = canvasMouseY - this.lastMouseY;

                    this.offsetX += dx;
                    this.offsetY += dy;

                    this.lastMouseX = canvasMouseX;
                    this.lastMouseY = canvasMouseY;

                    this.render();
                } else { this.showTooltip(e); }

                this.updateTooltip(e);
            }

            handleWheel(e) {
                e.preventDefault();

                const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                // Зум относительно положения курсора
                const zoomX = (mouseX - this.offsetX) / this.scale;
                const zoomY = (mouseY - this.offsetY) / this.scale;

                this.scale *= zoomFactor;

                // Ограничиваем масштаб
                this.scale = Math.min(Math.max(0.1, this.scale), 5);

                // Корректируем смещение, чтобы точка под курсором оставалась на месте
                this.offsetX = mouseX - zoomX * this.scale;
                this.offsetY = mouseY - zoomY * this.scale;

                this.render();
            }

            handleDblclick(e) {
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - this.offsetX) / this.scale;
                const mouseY = (e.clientY - rect.top - this.offsetY) / this.scale;

                // Проверяем, попали ли в какой-либо узел (в обратном порядке для правильного z-index)
                for (let i = this.allNodes.length - 1; i >= 0; i--) {
                    const node = this.allNodes[i];
                    if (node &&
                        mouseX >= node.x && mouseX <= node.x + node.width &&
                        mouseY >= node.y && mouseY <= node.y + node.height) {

                        if (node.ref) {
                            //console.log(node.ref );
                            return1c(e, { "type": "ОткрытьЗначение", "id": 0, "Ссылка": node.ref });
                        }
                        break;
                    }
                }
            }

            handleMouseUp() {
                if (this.draggedObject) {
                    this.draggedObject.endDrag();
                    this.draggedObject = null;
                }
                this.isDraggingCanvas = false;
                this.canvas.style.cursor = 'default';
                this.render();
            }

            handleClick(e) {
                e.preventDefault();
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - this.offsetX) / this.scale;
                const mouseY = (e.clientY - rect.top - this.offsetY) / this.scale;

                // Проверяем, попали ли в какой-либо узел (в обратном порядке для правильного z-index)
                // Но только если мы не перетаскивали объект
                if (!this.draggedObject && !this.isDraggingCanvas) {
                    for (let i = this.allNodes.length - 1; i >= 0; i--) {
                        const node = this.allNodes[i];
                        if (node &&
                            mouseX >= node.x && mouseX <= node.x + node.width &&
                            mouseY >= node.y && mouseY <= node.y + node.height) {

                            if (node.ref) {
                                //return1c(e, { "type": "ОткрытьЗначение", "id": 0, "Ссылка": node.ref });
                            }
                            break;
                        }
                    }
                }


            }

            showTooltip(e) {
                this.tooltip.style.display = 'block';
            }

            hideTooltip() {
                this.tooltip.style.display = 'none';
            }

            updateTooltip(e) {
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - this.offsetX) / this.scale;
                const mouseY = (e.clientY - rect.top - this.offsetY) / this.scale;

                let foundNode = null;

                // Ищем узел под курсором
                for (let i = this.allNodes.length - 1; i >= 0; i--) {
                    const node = this.allNodes[i];
                    if (node &&
                        mouseX >= node.x && mouseX <= node.x + node.width &&
                        mouseY >= node.y && mouseY <= node.y + node.height) {
                        foundNode = node;
                        break;
                    }
                }

                if (foundNode) {
                    let tooltipText = '';

                    if (foundNode instanceof Container) {
                        tooltipText = foundNode.tooltip || `Контейнер: ${foundNode.title}\nISO: ${foundNode.isotype}\nВес: ${foundNode.weight}\nМесто: ${foundNode.place}`;;
                        //tooltipText = `Контейнер: ${foundNode.title}\nISO: ${foundNode.isotype}\nВес: ${foundNode.weight}\nМесто: ${foundNode.place}`;
                    } else if (foundNode instanceof Good) {
                        tooltipText = foundNode.tooltip || `Груз: ${foundNode.title}\nВес: ${foundNode.weight}\nМесто: ${foundNode.place}`;;
                        //tooltipText = `Груз: ${foundNode.title}\nВес: ${foundNode.weight}\nМесто: ${foundNode.place}`;
                    }

                    this.tooltip.innerHTML = tooltipText.replace(/\n/g, '<br>');
                    this.tooltip.style.left = (e.clientX + 10) + 'px';
                    this.tooltip.style.top = (e.clientY + 10) + 'px';
                } else {
                    this.tooltip.style.display = 'none';
                }
            }
            // Расчет расстояния между двумя точками
            getDistance(x1, y1, x2, y2) {
                return Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
            }
            // Получение средней точки между двумя касаниями
            getMidpoint(touch1, touch2) {
                return {
                    x: (touch1.clientX + touch2.clientX) / 2,
                    y: (touch1.clientY + touch2.clientY) / 2
                };
            }

            handleresize() {

                this.render();
            }

            handleTouchStart(e) {
                e.preventDefault();
                const touches = e.touches;

                if (touches.length === 1) {
                    // Одиночное касание
                    const touch = touches[0];
                    const rect = this.canvas.getBoundingClientRect();
                    const mouseX = (touch.clientX - rect.left - this.offsetX) / this.scale;
                    const mouseY = (touch.clientY - rect.top - this.offsetY) / this.scale;

                    // Проверка двойного тапа
                    const currentTime = Date.now();
                    if (currentTime - this.lastTapTime < 300) {
                        // Двойной тап - начинаем перетаскивание объекта
                        let foundObject = null;
                        for (let i = this.allNodes.length - 1; i >= 0; i--) {
                            const node = this.allNodes[i];
                            if (node && node.containsPoint(mouseX, mouseY)) {
                                foundObject = node;
                                break;
                            }
                        }

                        if (foundObject) {
                            this.draggedObject = foundObject;
                            foundObject.startDrag(mouseX, mouseY);
                        }
                        this.lastTapTime = 0;
                    } else {
                        // Одиночный тап - запоминаем для возможного двойного тапа
                        this.lastTapTime = currentTime;
                        this.touchStartX = touch.clientX;
                        this.touchStartY = touch.clientY;
                    }

                    this.lastTouchX = touch.clientX;
                    this.lastTouchY = touch.clientY;
                } else if (touches.length === 2) {
                    // Два пальца - масштабирование
                    this.isMultiTouch = true;
                    const touch1 = touches[0];
                    const touch2 = touches[1];
                    this.lastDistance = this.getDistance(touch1.clientX, touch1.clientY, touch2.clientX, touch2.clientY);
                    const midpoint = this.getMidpoint(touch1, touch2);
                    this.lastTouchX = midpoint.x;
                    this.lastTouchY = midpoint.y;
                }

                this.render();
            }

            handleTouchMove(e) {
                e.preventDefault();
                const touches = e.touches;

                if (this.isMultiTouch && touches.length === 2) {
                    // Масштабирование двумя пальцами
                    const touch1 = touches[0];
                    const touch2 = touches[1];
                    const currentDistance = this.getDistance(touch1.clientX, touch1.clientY, touch2.clientX, touch2.clientY);
                    const midpoint = this.getMidpoint(touch1, touch2);

                    const scaleChange = currentDistance / this.lastDistance;
                    this.scale *= scaleChange;
                    this.scale = Math.min(Math.max(0.1, this.scale), 5);

                    // Корректируем смещение для масштабирования относительно центра
                    const rect = this.canvas.getBoundingClientRect();
                    const zoomX = (midpoint.x - rect.left - this.offsetX) / this.scale;
                    const zoomY = (midpoint.y - rect.top - this.offsetY) / this.scale;

                    this.offsetX = midpoint.x - rect.left - zoomX * this.scale;
                    this.offsetY = midpoint.y - rect.top - zoomY * this.scale;

                    this.lastDistance = currentDistance;
                    this.lastTouchX = midpoint.x;
                    this.lastTouchY = midpoint.y;

                    this.render();
                } else if (touches.length === 1 && !this.isMultiTouch) {
                    // Перетаскивание одним пальцем
                    const touch = touches[0];
                    const rect = this.canvas.getBoundingClientRect();

                    if (this.draggedObject) {
                        // Перетаскиваем объект
                        const mouseX = (touch.clientX - rect.left - this.offsetX) / this.scale;
                        const mouseY = (touch.clientY - rect.top - this.offsetY) / this.scale;
                        this.draggedObject.updateDrag(mouseX, mouseY, this.allNodes);
                        this.render();
                    } else {
                        // Перетаскиваем холст
                        const dx = touch.clientX - this.lastTouchX;
                        const dy = touch.clientY - this.lastTouchY;

                        this.offsetX += dx;
                        this.offsetY += dy;

                        this.lastTouchX = touch.clientX;
                        this.lastTouchY = touch.clientY;

                        this.render();
                    }
                }

                // Обновляем тултип
                if (touches.length > 0) {
                    const touch = touches[0];
                    const fakeEvent = {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    };
                    this.updateTooltip(fakeEvent);
                }
            }

            handleTouchEnd(e) {
                e.preventDefault();
                this.isMultiTouch = false;
                this.lastDistance = 0;

                if (this.draggedObject) {
                    this.draggedObject.endDrag();
                    this.draggedObject = null;
                }

                this.render();
            }



        }

        };
