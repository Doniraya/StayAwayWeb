        // Полифил для roundRect, если метод не поддерживается
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, width, height, radius) {
                if (typeof radius === 'number') {
                    radius = { tl: radius, tr: radius, br: radius, bl: radius };
                } else {
                    const defaultRadius = { tl: 0, tr: 0, br: 0, bl: 0 };
                    radius = { ...defaultRadius, ...radius };
                }

                this.beginPath();
                this.moveTo(x + radius.tl, y);
                this.lineTo(x + width - radius.tr, y);
                this.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
                this.lineTo(x + width, y + height - radius.br);
                this.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
                this.lineTo(x + radius.bl, y + height);
                this.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
                this.lineTo(x, y + radius.tl);
                this.quadraticCurveTo(x, y, x + radius.tl, y);
                this.closePath();
                return this;
            };
        }

        function CallMethod(id, methodName, attr = "") {//вызвать метод у элемента  , пока не используется нигде

            let t = document.getElementById(id);
            if (t == null) return;
            let obj = undefined;
            try {
                let obj = JSON.parse(attr);

            } catch (err) {
            }
            t[methodName](obj);

        function AddElement(parentid, id, type = "div", attr = "", innerHTML = null) {//добавить элемент формы
            //parentid - внутрь чего мы его помеещаем,
            // id - новый ИД нового элемента,если "" то элемент будет создан без ИД
            // type = тэг элемента, div button да что угодно  
            // attr = JSON строка с атрибутами тэга,
            // innerHTML = содержимое тэга
            let t = document.getElementById(id);
            if (t != null) return t;
            let ul = document.getElementById(parentid);
            t = document.createElement(type);
            if (id != "") t.setAttribute("id", id);
            if (innerHTML != null) t.innerHTML = innerHTML;
            try {
                let obj = JSON.parse(attr);
                for (let prop in obj) {
                    t.setAttribute(prop, obj[prop]);
                }
            } catch (err) {
            }
            ul.appendChild(t);
            return t;
        }

        function UpdateStyle(id, styleattr) {// обновляет атрибуты стиля тэга
            let e = document.getElementById(id);
            if (e == null) return;

            try {
                let obj = JSON.parse(styleattr);
                for (let prop in obj) {
                    e.style[prop] = obj[prop];
                }
            } catch (err) {
            }

        }

        function HideElement(id) {//добавим элементу css класс .off чтобы он исчез

            let elem = document.getElementById(id);
            if (elem == null) return;
            elem.classList.add("off");
        }

        function addCSSClass(data) {//добавим новый css класс в коллекцию css 
            //таким образом мы можем загрузить картинки в стиль и многократно ссылаясь на этот стиль использовать подготовленную картинку, не передавая ее каждый раз как она нужна
            let innerHTML = JSON.parse(data);
            let style = document.createElement('style');
            style.type = 'text/css';
            style.innerHTML = innerHTML;
            document.getElementsByTagName('head')[0].appendChild(style);
        }

            let element = document.getElementById(id);

            element.onclick = (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
                ev.stopImmediatePropagation();
                return1c(ev, { "type": type, "id": id, "ref": ref });
            }

        }

        function OnEvent(eventType, id, type, ref) {//добавим обработку события элемента , с отправкой резульата в 1С
            let element = document.getElementById(id);
            element.addEventListener(eventType, (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
                return1c(ev, { "type": type, "id": id, "ref": ref });
            });
        }



        class Vector2D {
            constructor(x = 0, y = 0) {
                this.x = x;
                this.y = y;
            }

            //fromAngle(angle = 0) {
            //    this.x = Math.cos(angle);
            //    this.y = Math.sin(angle);
            //}

            add(v) {
                return new Vector2D(
                    this.x + v.x,
                    this.y + v.y
                );
            }

            subtract(v) {
                return new Vector2D(
                    this.x - v.x,
                    this.y - v.y
                );
            }

            mul(s) {
                return new Vector2D(
                    this.x * s,
                    this.y * s
                );
            }

            len() {
                return Math.sqrt(this.x * this.x + this.y * this.y);
            }

            dot(v) {
                return this.x * v.x + this.y * v.y;
            }

            centerBetween(v) {
                return new Vector2D((this.x + v.x) / 2, (this.y + v.y) / 2);
            }

            angle() {
                return Math.atan2(this.y, this.x);
            }



        }

                this.isDragging = false;
                this.dragOffsetX = 0;
                this.dragOffsetY = 0;
                if (!this.isotype && this.type == 'warehouse_good') this.isotype = 'Ген. Груз';
            }

            render(ctx, isContainerGood = false) {
                // Основной прямоугольник груза
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 8);

                // Разные цвета для грузов в контейнере и на складе
                if (isContainerGood) {
                    ctx.fillStyle = '#fff3cd'; // Желтый для грузов в контейнере
                } else {
                    ctx.fillStyle = '#ccffe5'; // Голубой для грузов на складе
                }

                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.stroke();


                let lines = [0.4, 0.7];

                // Текст
                ctx.fillStyle = '#333';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';


                // Разделительные линии
                ctx.beginPath();

                //ctx.moveTo(this.x, this.y + this.height * lines[0]);
                // ctx.lineTo(this.x + this.width, this.y + this.height * lines[0]);
                ctx.moveTo(this.x, this.y + this.height * lines[1]);
                ctx.lineTo(this.x + this.width, this.y + this.height * lines[1]);
                ctx.strokeStyle = '#999';
                ctx.stroke();


                let titlestartX = 0;

                if (this.isotype) {
                    //let metrics = ctx.measureText(this.isotype);
                    titlestartX = 25;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + this.height * lines[0]);
                    ctx.lineTo(this.x + titlestartX, this.y + this.height * lines[0]);
                    ctx.lineTo(this.x + titlestartX, this.y);
                    ctx.stroke();
                    //ctx.fillText(this.isotype, this.x, this.y);
                    this.wrapText(ctx, this.isotype, this.x + 15, this.y + this.height / 9, titlestartX, 10, this.y + this.height / 3);

                }

                // Title с переносами
                this.wrapText(ctx, this.title, this.x + this.width / 2 + titlestartX / 2, this.y + this.height / 9, this.width - 10 - titlestartX, 10, this.y + this.height * lines[1]);

                // Place
                //ctx.fillText(`${this.place} / ${this.weight}`, this.x + this.width / 2, this.y + (this.height * lines[0] + this.height * lines[1]) / 2);

                // Weight
                ctx.fillText(`${this.place} / ${this.weight}`, this.x + this.width / 2, this.y + (this.height * lines[1] + this.height) / 2);
            }

            wrapText(ctx, text, x, y, maxWidth, lineHeight, boxHeight) {
                const words = text.split(/[\s\n|(<br>)]/);
                /*
                let words = [];
                for(let w of tempwords){
                    const metrics = ctx.measureText(w).width;
                    const testWidth = metrics.width;

                    if (testWidth > maxWidth ) 
                } */
                let line = '';
                let currentY = y;

                for (let i = 0; i < words.length; i++) {
                    const testLine = line + words[i] + ' ';
                    const metrics = ctx.measureText(testLine);
                    const testWidth = metrics.width;

                    if (testWidth > maxWidth && i > 0) {
                        if ((currentY + lineHeight) > boxHeight) { ctx.fillText(line + '...', x, currentY); return }
                        ctx.fillText(line, x, currentY);
                        line = words[i] + ' ';
                        currentY += lineHeight;

                    } else {
                        line = testLine;
                    }
                }

                ctx.fillText(line, x, currentY);
            }



            getNearPoint(targetCenterX, targetCenterY) {

                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2;
                const dx = targetCenterX - centerX;
                const dy = targetCenterY - centerY;
                const length = Math.sqrt(dx * dx + dy * dy);
                if (length === 0) return new Vector2D(centerX, centerY);

                const normDx = dx / length;
                const normDy = dy / length;

                let edgeX, edgeY;

                // Проверяем пересечение с каждой стороной прямоугольника
                if (normDx < 0) {
                    const t = (this.x - centerX) / normDx;
                    const intersectY = centerY + t * normDy;
                    if (intersectY >= this.y && intersectY <= this.y + this.height) {
                        edgeX = this.x;
                        edgeY = intersectY;
                        return new Vector2D(edgeX, edgeY);
                    }
                }

                if (normDx > 0) {
                    const t = (this.x + this.width - centerX) / normDx;
                    const intersectY = centerY + t * normDy;
                    if (intersectY >= this.y && intersectY <= this.y + this.height) {
                        edgeX = this.x + this.width;
                        edgeY = intersectY;
                        return new Vector2D(edgeX, edgeY);
                    }
                }

                if (normDy < 0) {
                    const t = (this.y - centerY) / normDy;
                    const intersectX = centerX + t * normDx;
                    if (intersectX >= this.x && intersectX <= this.x + this.width) {
                        edgeX = intersectX;
                        edgeY = this.y;
                        return new Vector2D(edgeX, edgeY);
                    }
                }

                if (normDy > 0) {
                    const t = (this.y + this.height - centerY) / normDy;
                    const intersectX = centerX + t * normDx;
                    if (intersectX >= this.x && intersectX <= this.x + this.width) {
                        edgeX = intersectX;
                        edgeY = this.y + this.height;
                        return new Vector2D(edgeX, edgeY);
                    }
                }

                return new Vector2D(centerX, centerY);
            }

            getConnectorPoint(targetNode) {

                const targetCenterX = targetNode.x + targetNode.width / 2;
                const targetCenterY = targetNode.y + targetNode.height / 2;
                return this.getNearPoint(targetCenterX, targetCenterY);
            }


            // Проверка, пересекается ли точка с этим объектом
            intersectsPoint(px, py) {
                return px >= this.x && px <= this.x + this.width &&
                    py >= this.y && py <= this.y + this.height;
            }

            // Проверка, пересекается ли линия с этим объектом
            intersectsLine(x1, y1, x2, y2) {
                // Простая проверка: если оба конца линии вне прямоугольника и линия не пересекает стороны
                // Проверяем пересечение с каждой стороной прямоугольника
                const rectLines = [
                    { x1: this.x, y1: this.y, x2: this.x + this.width, y2: this.y }, // верх
                    { x1: this.x + this.width, y1: this.y, x2: this.x + this.width, y2: this.y + this.height }, // правая
                    { x1: this.x, y1: this.y + this.height, x2: this.x + this.width, y2: this.y + this.height }, // низ
                    { x1: this.x, y1: this.y, x2: this.x, y2: this.y + this.height } // левая
                ];

                for (let i = 0; i < rectLines.length; i++) {
                    if (this.lineIntersectsLine(x1, y1, x2, y2,
                        rectLines[i].x1, rectLines[i].y1,
                        rectLines[i].x2, rectLines[i].y2)) {
                        return true;
                    }
                }

                // Проверяем, не находится ли один из концов линии внутри прямоугольника
                if (this.intersectsPoint(x1, y1) || this.intersectsPoint(x2, y2)) {
                    return true;
                }

                return false;
            }

            lineIntersectsLine(x1, y1, x2, y2, x3, y3, x4, y4) {
                // Проверка пересечения двух отрезков
                const denominator = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
                if (denominator === 0) return false;

                const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denominator;
                const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denominator;

                return ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1;
            }

            getLineCount(node = null) {

            }

                this.incoming = [];
                this.gridCols = 2;
                this.gridRows = 2;
                this.isDragging = false;
                this.dragOffsetX = 0;
                this.dragOffsetY = 0;
                this.container = this;
                this.type = 'container';
            }

            addGood(good) {
                this.goods.push(good);
                good.containerId = this.id;
                good.container = this;
                good.gridIndex = this.goods.length - 1;
                if (this.goods.length > this.gridCols * this.gridRows) {
                    this.gridRows = Math.round(this.goods.length / this.gridCols);
                    this.height = this.headerHeight + (this.gridRows * (good.height + this.containerPadding));
                }

            }

            layoutGoods() {
                if (this.goods.length === 0) return;

                const gridWidth = this.width - 2 * this.containerPadding;
                const gridHeight = this.height - this.headerHeight - 2 * this.containerPadding;
                const cellWidth = (gridWidth - (this.gridCols - 1) * 8) / this.gridCols;
                const cellHeight = (gridHeight - (this.gridRows - 1) * 8) / this.gridRows;

                this.goods.forEach((good, index) => {
                    const col = index % this.gridCols;
                    const row = Math.floor(index / this.gridCols);

                    good.x = this.x + this.containerPadding + col * (cellWidth + 8);
                    good.y = this.y + this.headerHeight + this.containerPadding + row * (cellHeight + 8);
                    good.width = cellWidth;
                    good.height = cellHeight;
                });
            }

            render(ctx) {
                // Основной прямоугольник контейнера
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 10);
                ctx.fillStyle = '#f0f0f0';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Шапка контейнера
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.headerHeight, { tl: 10, tr: 10, br: 0, bl: 0 });
                ctx.fillStyle = '#e0e0e0';
                ctx.fill();
                ctx.stroke();

                // Разделительные линии в шапке
                const col1Width = this.width * 0.2;
                const col2Width = this.width * 0.5;
                const col3Width = this.width * 0.3;

                // Первая колонка (isotype)
                ctx.fillStyle = '#333';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const isotype = this.isotype;// || "N/A";
                ctx.fillText(isotype, this.x + col1Width / 2, this.y + this.headerHeight / 2);

                ctx.beginPath();
                ctx.moveTo(this.x + col1Width, this.y);
                ctx.lineTo(this.x + col1Width, this.y + this.headerHeight);
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Вторая колонка (title)
                const title = this.title;// || "Без названия";
                ctx.fillText(title, this.x + col1Width + col2Width / 2, this.y + this.headerHeight / 2);

                // Третья колонка (place и weight)
                ctx.beginPath();
                ctx.moveTo(this.x + col1Width + col2Width, this.y);
                ctx.lineTo(this.x + col1Width + col2Width, this.y + this.headerHeight);
                ctx.strokeStyle = '#999';

                // Горизонтальная разделительная линия в шапке
                ctx.beginPath();
                ctx.moveTo(this.x + col1Width + col2Width, this.y + this.headerHeight / 2);
                ctx.lineTo(this.x + this.width, this.y + this.headerHeight / 2);
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 1;
                ctx.stroke();
                // ctx.stroke();
            }


            getNearPoint(targetCenterX, targetCenterY) {


                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2;
                const dx = targetCenterX - centerX;
                const dy = targetCenterY - centerY;
                const length = Math.sqrt(dx * dx + dy * dy);
                if (length === 0) return new Vector2D(centerX, centerY);

                const normDx = dx / length;
                const normDy = dy / length;

                let edgeX, edgeY;

                if (normDx < 0) {
                    const t = (this.x - centerX) / normDx;
                    const intersectY = centerY + t * normDy;
                    if (intersectY >= this.y && intersectY <= this.y + this.height) {
                        edgeX = this.x;
                        edgeY = intersectY;
                        return new Vector2D(edgeX, edgeY);
                    }
                }

                if (normDx > 0) {
                    const t = (this.x + this.width - centerX) / normDx;
                    const intersectY = centerY + t * normDy;
                    if (intersectY >= this.y && intersectY <= this.y + this.height) {
                        edgeX = this.x + this.width;
                        edgeY = intersectY;
                        return new Vector2D(edgeX, edgeY);
                    }
                }

                if (normDy < 0) {
                    const t = (this.y - centerY) / normDy;
                    const intersectX = centerX + t * normDx;
                    if (intersectX >= this.x && intersectX <= this.x + this.width) {
                        edgeX = intersectX;
                        edgeY = this.y;
                        return new Vector2D(edgeX, edgeY);
                    }
                }

                if (normDy > 0) {
                    const t = (this.y + this.height - centerY) / normDy;
                    const intersectX = centerX + t * normDx;
                    if (intersectX >= this.x && intersectX <= this.x + this.width) {
                        edgeX = intersectX;
                        edgeY = this.y + this.height;
                        return new Vector2D(edgeX, edgeY);
                    }
                }

                return new Vector2D(centerX, centerY);
            }




            getConnectorPoint(targetNode) {

                const targetCenterX = targetNode.x + targetNode.width / 2;
                const targetCenterY = targetNode.y + targetNode.height / 2;
                return this.getNearPoint(targetCenterX, targetCenterY);

            }


            // Проверка, пересекается ли точка с этим объектом
            intersectsPoint(px, py) {
                return px >= this.x && px <= this.x + this.width &&
                    py >= this.y && py <= this.y + this.height;
            }

            // Проверка, пересекается ли линия с этим объектом
            intersectsLine(x1, y1, x2, y2) {
                // Простая проверка: если оба конца линии вне прямоугольника и линия не пересекает стороны
                // Проверяем пересечение с каждой стороной прямоугольника
                const rectLines = [
                    { x1: this.x, y1: this.y, x2: this.x + this.width, y2: this.y }, // верх
                    { x1: this.x + this.width, y1: this.y, x2: this.x + this.width, y2: this.y + this.height }, // правая
                    { x1: this.x, y1: this.y + this.height, x2: this.x + this.width, y2: this.y + this.height }, // низ
                    { x1: this.x, y1: this.y, x2: this.x, y2: this.y + this.height } // левая
                ];

                for (let i = 0; i < rectLines.length; i++) {
                    if (this.lineIntersectsLine(x1, y1, x2, y2,
                        rectLines[i].x1, rectLines[i].y1,
                        rectLines[i].x2, rectLines[i].y2)) {
                        return true;
                    }
                }

                // Проверяем, не находится ли один из концов линии внутри прямоугольника
                if (this.intersectsPoint(x1, y1) || this.intersectsPoint(x2, y2)) {
                    return true;
                }

                return false;
            }

            lineIntersectsLine(x1, y1, x2, y2, x3, y3, x4, y4) {
                // Проверка пересечения двух отрезков
                const denominator = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
                if (denominator === 0) return false;

                const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denominator;
                const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denominator;

                return ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1;
            }

        }
        // Алгоритм Дейкстры для поиска пути обхода препятствий
        class PathFinder {
            constructor(objects) {
                this.VirtualObstacles = [];
                this.objects = objects; // Все объекты, которые нужно обойти
                this.gridSize = 20; // Размер ячейки сетки для поиска пути
                this.createGrid();

            }

            // Создаем сетку вокруг объектов
            createGrid(exclude = [], virtualBlocks = []) {
                // Находим границы всех объектов
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

                this.objects.forEach(obj => {
                    minX = Math.min(minX, obj.x - 50);
                    minY = Math.min(minY, obj.y - 50);
                    maxX = Math.max(maxX, obj.x + obj.width + 50);
                    maxY = Math.max(maxY, obj.y + obj.height + 50);
                });

                // Создаем сетку
                const gridWidth = Math.ceil((maxX - minX) / this.gridSize);
                const gridHeight = Math.ceil((maxY - minY) / this.gridSize);

                const grid = [];
                for (let y = 0; y < gridHeight; y++) {
                    grid[y] = [];
                    for (let x = 0; x < gridWidth; x++) {
                        grid[y][x] = {
                            x: minX + x * this.gridSize,
                            y: minY + y * this.gridSize,
                            cost: 1,
                            visited: false,
                            distance: Infinity,
                            previous: null,
                            isObstacle: false,
                            obj: null
                        };
                    }
                }




                // Помечаем ячейки, которые пересекаются с объектами, как препятствия
                for (let y = 0; y < gridHeight; y++) {
                    for (let x = 0; x < gridWidth; x++) {
                        const cell = grid[y][x];
                        const cellCenterX = cell.x + this.gridSize / 2;
                        const cellCenterY = cell.y + this.gridSize / 2;

                        // Проверяем, пересекается ли ячейка с каким-либо объектом
                        for (let i = 0; i < this.objects.length; i++) {
                            const obj = this.objects[i];
                            if (exclude.find(x => x == obj) == undefined)
                                if (obj.intersectsPoint(cellCenterX, cellCenterY)) {
                                    cell.isObstacle = true;
                                    cell.obj = obj;
                                    cell.cost = Infinity;
                                    break;
                                }
                        }
                    }
                }

                this.grid = grid;
                this.width = gridWidth;
                this.height = gridHeight;
                this.minX = minX;
                this.minY = minY;


                for (let c of virtualBlocks) {
                    let cellxy1 = this.getGridCell(c[0].x, c[0].y);
                    let cellxy2 = this.getGridCell(c[1].x, c[1].y);
                    //let cell = this.grid[cellxy.y][cellxy.x];
                    //cell.isObstacle = true;
                    //cell.obj = obj;
                    //cell.cost = Infinity;
                    let maxy = Math.max(cellxy1.y, cellxy2.y);
                    let miny = Math.min(cellxy1.y, cellxy2.y);
                    let maxx = Math.max(cellxy1.x, cellxy2.x);
                    let minx = Math.min(cellxy1.x, cellxy2.x);

                    for (let y = miny; y <= maxy; y++)
                        for (let x = minx; x <= maxx; x++)
                            this.grid[y][x].isObstacle = true;
                }


                for (let c of this.VirtualObstacles) {
                    let cellxy = this.getGridCell(c.x, c.y);
                    //let cell = this.grid[cellxy.y][cellxy.x];
                    //cell.isObstacle = true;
                    //cell.obj = obj;
                    //cell.cost = Infinity;

                    this.grid[cellxy.y][cellxy.x].isObstacle = true;
                    // this.grid[cellxy.y + 1][cellxy.x + 1].isObstacle = true;
                    //this.grid[cellxy.y][cellxy.x + 1].isObstacle = true;
                    // this.grid[cellxy.y-1][cellxy.x].isObstacle = true;
                }



                return {
                    grid: grid,
                    width: gridWidth,
                    height: gridHeight,
                    minX: minX,
                    minY: minY
                };
            }

            drawGrid(ctx) {

                for (let y = 0; y < this.height; y++) {
                    for (let x = 0; x < this.width; x++) {
                        const cell = this.grid[y][x];
                        const cellCenterX = cell.x + this.gridSize / 2;
                        const cellCenterY = cell.y + this.gridSize / 2;
                        if (cell.isObstacle == false) continue;
                        ctx.beginPath();
                        ctx.strokeStyle = '#000000';

                        ctx.moveTo(cell.x, cell.y + this.gridSize);
                        ctx.lineTo(cell.x + this.gridSize, cell.y + this.gridSize);
                        ctx.stroke();
                        ctx.moveTo(cell.x + this.gridSize, cell.y);
                        ctx.lineTo(cell.x + this.gridSize, cell.y + this.gridSize);
                        ctx.moveTo(cell.x, cell.y);
                        ctx.lineTo(cell.x + this.gridSize, cell.y);
                        ctx.stroke();

                        ctx.closePath();



                    }
                }

            }

            // Получаем соседей ячейки
            getNeighbors(x, y) {
                const neighbors = [];
                const directions = [
                    { dx: -1, dy: 0 }, { dx: 1, dy: 0 }, // лево, право
                    { dx: 0, dy: -1 }, { dx: 0, dy: 1 }, // верх, низ
                    { dx: -1, dy: -1 }, { dx: 1, dy: -1 }, // диагонали
                    { dx: -1, dy: 1 }, { dx: 1, dy: 1 }
                ];

                for (let i = 0; i < directions.length; i++) {
                    const nx = x + directions[i].dx;
                    const ny = y + directions[i].dy;

                    if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height) {
                        if (!this.grid[ny][nx].isObstacle) {// || this.grid[ny][nx].obj == obj ) {
                            neighbors.push({ x: nx, y: ny });
                        }
                    }
                }

                return neighbors;
            }

            // Расстояние между двумя точками
            distance(x1, y1, x2, y2) {
                return Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
            }

            // Находим ячейку сетки, ближайшую к точке
            getGridCell(px, py) {
                const gridX = Math.floor((px - this.minX) / this.gridSize);
                const gridY = Math.floor((py - this.minY) / this.gridSize);

                // Ограничиваем значения
                return {
                    x: Math.max(0, Math.min(this.width - 1, gridX)),
                    y: Math.max(0, Math.min(this.height - 1, gridY))
                };
            }

            // Поиск пути с использованием алгоритма Дейкстры
            findPath(fromPoint, toPoint, fromNode, toNode, virtualBlocks) {
                this.createGrid([fromNode.container, fromNode, toNode], virtualBlocks);

                // Находим начальную и конечную ячейки
                const startCell = this.getGridCell(fromPoint.x, fromPoint.y);
                let endCell = this.getGridCell(toPoint.x, toPoint.y);

                // Если начальная или конечная ячейка - препятствие, используем ближайшие свободные ячейки
                if (this.grid[startCell.y][startCell.x].isObstacle) {
                    // Ищем ближайшую свободную ячейку
                    let found = false;
                    for (let d = 1; d < 10 && !found; d++) {
                        for (let dx = -d; dx <= d && !found; dx++) {
                            for (let dy = -d; dy <= d && !found; dy++) {
                                const nx = startCell.x + dx;
                                const ny = startCell.y + dy;
                                if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height) {
                                    if (!this.grid[ny][nx].isObstacle) {
                                        startCell.x = nx;
                                        startCell.y = ny;
                                        found = true;
                                    }
                                }
                            }
                        }
                    }
                }

                if (this.grid[endCell.y][endCell.x].isObstacle) {
                    let found = false;
                    for (let d = 1; d < 10 && !found; d++) {
                        for (let dx = -d; dx <= d && !found; dx++) {
                            for (let dy = -d; dy <= d && !found; dy++) {
                                const nx = endCell.x + dx;
                                const ny = endCell.y + dy;
                                if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height) {
                                    if (!this.grid[ny][nx].isObstacle) {
                                        endCell.x = nx;
                                        endCell.y = ny;
                                        found = true;
                                    }
                                }
                            }
                        }
                    }
                }

                // Инициализация
                const pq = []; // Приоритетная очередь
                let cc = this.grid[startCell.y][startCell.x];
                cc.distance = 0;
                pq.push({ x: startCell.x, y: startCell.y, distance: 0 });

                while (pq.length > 0) {
                    // Находим ячейку с минимальным расстоянием
                    pq.sort((a, b) => a.distance - b.distance);
                    const current = pq.shift();
                    const cell = this.grid[current.y][current.x];
                    if (cell.visited) continue;
                    cell.visited = true;
                    // Если достигли цели
                    if (current.x === endCell.x && current.y === endCell.y) {
                        break;
                    }
                    // Проверяем соседей
                    const neighbors = this.getNeighbors(current.x, current.y);
                    for (let i = 0; i < neighbors.length; i++) {
                        const neighbor = neighbors[i];
                        const nCell = this.grid[neighbor.y][neighbor.x];
                        if (nCell.visited) continue;
                        const newDistance = cell.distance + this.distance(
                            cell.x, cell.y, nCell.x, nCell.y
                        );

                        if (newDistance < nCell.distance) {
                            nCell.distance = newDistance;
                            nCell.previous = { x: current.x, y: current.y };
                            pq.push({ x: neighbor.x, y: neighbor.y, distance: newDistance });
                        }
                    }
                }

                // Восстанавливаем путь
                const path = [];
                let current = endCell;

                while (current) {
                    const cell = this.grid[current.y][current.x];
                    path.unshift({
                        x: cell.x + this.gridSize / 2,
                        y: cell.y + this.gridSize / 2
                    });

                    if (cell.previous) {
                        current = cell.previous;
                    } else {
                        break;
                    }
                }
                // Если путь не найден, возвращаем прямую линию
                if (path.length <= 1) {
                    return [
                        fromPoint,
                        toPoint
                    ];
                }
                // Добавляем начальную и конечную точки для точности
                if (path.length > 0) {
                    const firstPoint = path[0];
                    const lastPoint = path[path.length - 1];
                    // Проверяем, что первая точка не совпадает с начальной
                    if (this.distance(firstPoint.x, firstPoint.y, fromPoint.x, fromPoint.y) > 5) {
                        path.unshift({ x: fromPoint.x, y: fromPoint.y });
                    }
                    // Проверяем, что последняя точка не совпадает с конечной
                    if (this.distance(lastPoint.x, lastPoint.y, toPoint.x, toPoint.y) > 5) {
                        path.push({ x: toPoint.x, y: toPoint.y });
                    }
                }
                this.VirtualObstacles = this.VirtualObstacles.concat(path);
                return path;
            }

            // Упрощаем путь, удаляя лишние точки
            simplifyPath(path, tolerance = 2, fromNode, toNode) {
                if (path.length <= 2) return path;

                const simplified = [];//[path[0]];
                let i = 0;
                for (; i < path.length - 1; i++)
                    if (!fromNode.intersectsPoint(path[i].x, path[i].y)) {
                        let p = fromNode.getNearPoint(path[i].x, path[i].y);
                        simplified.push(p);
                        break;
                    }

                for (; i < path.length - 1; i++) {
                    const prev = simplified[simplified.length - 1];
                    const current = path[i];
                    const next = path[i + 1];
                    if (toNode.intersectsPoint(path[i].x, path[i].y)) {
                        let p = toNode.getNearPoint(prev.x, prev.y);
                        simplified.push(p);
                        break;
                    }
                    // Проверяем, можно ли удалить текущую точку
                    // (если линия от предыдущей до следующей не пересекает препятствия)
                    let canRemove = true;
                    for (let j = 0; j < this.objects.length; j++) {
                        if (this.objects[j].intersectsLine(prev.x, prev.y, next.x, next.y)) {
                            canRemove = false;
                            break;
                        }
                    }
                    if (!canRemove || this.pointToLineDistance(current.x, current.y, prev.x, prev.y, next.x, next.y) > tolerance) {
                        simplified.push(current);
                    }
                }
                return simplified;
            }

            // Расстояние от точки до линии
            pointToLineDistance(px, py, x1, y1, x2, y2) {
                const A = px - x1;
                const B = py - y1;
                const C = x2 - x1;
                const D = y2 - y1;

                const dot = A * C + B * D;
                const lenSq = C * C + D * D;
                let param = -1;
                if (lenSq !== 0) param = dot / lenSq;

                let xx, yy;

                if (param < 0) {
                    xx = x1;
                    yy = y1;
                } else if (param > 1) {
                    xx = x2;
                    yy = y2;
                } else {
                    xx = x1 + param * C;
                    yy = y1 + param * D;
                }

                const dx = px - xx;
                const dy = py - yy;
                return Math.sqrt(dx * dx + dy * dy);
            }
        }

        class PotentialField {
            constructor(width, height, cellSize) {
                this.width = width;
                this.height = height;
                this.cellSize = cellSize;
                this.cols = Math.ceil(width / cellSize);
                this.rows = Math.ceil(height / cellSize);
                this.field = [];
                this.clear();
            }

            clear() {
                // Инициализируем поле нулями
                for (let y = 0; y < this.rows; y++) {
                    this.field[y] = [];
                    for (let x = 0; x < this.cols; x++) {
                        this.field[y][x] = 0;
                    }
                }
            }

            //node размещаемый объект
            //nodes размещеные ранее объекты 
            init(node, nodes, params = { OptimalLineOffsetCell: 34, OptimallineWidthCell: 20, radius: 20, centralobj: null }) {
                this.clear();
                let obstacles = [];
                for (let c of nodes) {

                    if (c.isContainConnectedTo(node)) {

                        obstacles = obstacles.concat(c.goods);
                        for (let g of c.goods) {
                            this.placeNode(node, g, params, obstacles);
                            this.addObjectInfinit(g);
                        }
                        this.addObjectInfinit(c);
                        continue;
                    }
                    this.placeNode(node, c, params, obstacles);
                    this.addObjectInfinit(c);
                    obstacles.push(c);
                }
                //this.calcVoronoiField(node, nodes);
                //this.calcVoronoiFieldByCell(node, nodes, params);
            }




            calcVoronoiField(node, nodes) {
                for (let y = 0; y < this.rows; y++) {
                    for (let x = 0; x < this.cols; x++) {
                        const v = this.field[y][x];
                        if (v == Infinity) continue;
                        const crd = this.cellToCoord(x, y);
                        let near = { near: Infinity, obj: null };
                        for (let c of nodes) {
                            if (c.isContainConnectedTo(node)) {
                                for (let g of c.goods)
                                    this.calcVoronoi(g, crd.x, crd.y, near);
                                continue;
                            }
                            this.calcVoronoi(c, crd.x, crd.y, near);
                        }

                        if (near.obj == null) continue;
                        let OptimalLineOffset = 400;
                        let dn = OptimalLineOffset - near.near;
                        let OptimallineWidth = 10;
                        let s = (near.obj.isConnectedTo(node)) ? -Math.exp(-dn * dn / OptimallineWidth) * 10 : 0;// Math.exp((near.near-100)/100): Infinity;
                        this.field[y][x] += s;
                    }
                }
            }

            calcVoronoiFieldByCell(node, nodes, params = { OptimalLineOffsetCell: 34, OptimallineWidthCell: 20 }) {
                for (let y = 0; y < this.rows; y++) {
                    for (let x = 0; x < this.cols; x++) {
                        const v = this.field[y][x];
                        if (v == Infinity) continue;
                        //const crd = this.cellToCoord(x, y);
                        let near = { near: Infinity, obj: null };
                        for (let c of nodes) {
                            if (c.isContainConnectedTo(node)) {
                                for (let g of c.goods)
                                    this.calcVoronoiCell(g, x, y, near);
                                continue;
                            }
                            this.calcVoronoiCell(c, x, y, near);
                        }
                        if (near.obj == null) continue;
                        let OptimalLineOffsetCell = params.OptimalLineOffsetCell;
                        let dn = OptimalLineOffsetCell - near.near;
                        let OptimallineWidthCell = params.OptimallineWidthCell;
                        let s = (near.obj.isConnectedTo(node)) ? -Math.exp(-dn * dn / OptimallineWidthCell) * 1000 : 0;//Math.exp(-dn * dn / OptimallineWidthCell);// Math.exp((near.near-100)/100): Infinity;
                        this.field[y][x] += s;
                    }
                }
            }

            calcVoronoiCell(c, x, y, near) {
                let crd = this.coordToCell(c.x + c.width / 2, c.y + c.height / 2);
                let dx = x - crd.col;
                let dy = y - crd.row;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (near.near < dist) return;
                near.near = dist;
                near.obj = c;
            }

            calcVoronoi(c, x, y, near) {
                let dx = x - c.x - c.width / 2;
                let dy = y - c.y - c.height / 2;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (near.near < dist) return;
                near.near = dist;
                near.obj = c;
            }

            draw(ctx) {
                for (let y = 0; y < this.rows; y++) {
                    for (let x = 0; x < this.cols; x++) {
                        let v = this.field[y][x];
                        const crd = this.cellToCoord(x, y);
                        if (v == 0) continue;
                        if (v == Infinity) continue;
                        let g = Math.abs(Math.log10(Math.abs(v)));
                        let r = 255 / g;

                        let b = 0;
                        if (v < 0) { r = 0; b = 255 / g; }
                        g = g * 55;//magic
                        //v = (Math.log10(Math.abs(v)));
                        //if(v<=0)continue;
                        ctx.beginPath();
                        ctx.font = '8px Arial';
                        ctx.strokeStyle = `rgb(${r},${g},${b},0.5)`;//'red';
                        //if (v < 0) ctx.strokeStyle = 'blue';

                        ctx.rect(crd.x, crd.y, this.cellSize, this.cellSize);
                        ctx.stroke();
                        ctx.fillText(Math.ceil(v), crd.x + this.cellSize / 2, crd.y + this.cellSize / 2);
                        ctx.closePath();
                    }
                }
            }

            // Преобразуем координаты в индексы ячеек
            coordToCell(x, y) {
                return {
                    col: Math.floor(x / this.cellSize),
                    row: Math.floor(y / this.cellSize)
                };
            }

            // Преобразуем индексы ячеек в координаты
            cellToCoord(col, row) {
                return {
                    x: col * this.cellSize + this.cellSize / 2,
                    y: row * this.cellSize + this.cellSize / 2
                };
            }

            // Устанавливаем потенциал в ячейке
            setPotential(col, row, potential) {
                if (col >= 0 && col < this.cols && row >= 0 && row < this.rows) {
                    this.field[row][col] = potential;
                }
            }

            // Получаем потенциал из ячейки
            getPotential(col, row, cr, rr) {
                let p = 0;
                for (let y = row; y <= rr; y++)
                    for (let x = col; x <= cr; x++) {
                        if (x >= 0 && x < this.cols && y >= 0 && y < this.rows) {
                            p += this.field[y][x];
                        } else { p += Infinity; }
                    }
                return p;
            }



            addObjectInfinit(obj) {
                let w = 3;
                const leftupcorner = this.coordToCell(obj.x, obj.y);
                const rightdncorner = this.coordToCell(obj.x + obj.width, obj.y + obj.height);
                for (let dy = leftupcorner.row - 1; dy <= rightdncorner.row; dy++) {
                    for (let dx = leftupcorner.col - 1 - w; dx <= rightdncorner.col + w; dx++) {
                        if (dx >= 0 && dx < this.cols && dy >= 0 && dy < this.rows) {
                            this.field[dy][dx] = Infinity;
                        }
                    }
                }
            }



            //node - объект который мы планируем разместить но еще не разместили
            //c - объект уже размещен и он должен внести свое влияение
            //params - структура: 
            //{centralobj - 
            //radius - это просто  ширина и высота квадрата области 
            //OptimalLineOffsetCell
            // }
            placeNode(node, c, params, nodes) {
                let centralobj = params.centralobj;
                let s = 1;
                let cntObj = nodes.length;
                if (node instanceof Container) s = 10;//(!c.container) ? c.getLineCount() * 2 : c.container.getLineCount() * 80 + c.width * c.height / (this.cellSize * 16);
                //s += (!c.container)?c.getLineCount()*2:c.container.getLineCount()*80 + c.width*c.height/(this.cellSize*16);
                let r = params.radius;
                let m = 1.2;
                //let s = (c.isConnectedTo(node)) ? -1000 : 1;
                if (node.type === 'warehouse_good' || c.type === 'warehouse_good')
                    //if (node instanceof Container || node.type === 'warehouse_good')
                    if (c.isConnectedTo(centralobj) && node.isConnectedTo(centralobj) && cntObj < 3) { s = -700; m = 2; }
                if (c.isConnectedTo(node)) s = -1000;
                let x = c.x + c.width / 2;
                let y = c.y + c.height / 2;

                //let r = Math.floor(Math.sqrt(c.width*c.height)/5);///params.radius);
                //if(c.type == 'warehouse_good')r = 1;
                this.addObjectInfluence(x, y, s, r, c, params, nodes, m);
            }

            // Добавляем влияние объекта на поле (гауссово распределение)
            //  strength < 0 - когда до объекта нет ни одной связи
            // strength > 0 - когда с объектом есть связь
            addObjectInfluence(objX, objY, strength = 100, radius = 5, obj, params, nodes = [], m = 1.2) {
                let sered = (obj.width + obj.height) / 4;
                const center = this.coordToCell(objX, objY);
                const leftup = this.coordToCell(objX - sered, objY - sered);
                const rightdown = this.coordToCell(obj.x + sered, obj.y + sered);
                let co = params.centralobj;
                let cox = co.x + co.width / 2;
                let coy = co.y + co.height / 2;

                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const col = center.col + dx;
                        const row = center.row + dy;
                        if (col >= 0 && col < this.cols && row >= 0 && row < this.rows) {
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance > radius) continue;


                            let OptimalLineOffsetCell = params.OptimalLineOffsetCell;
                            let dn = OptimalLineOffsetCell - distance;
                            let OptimallineWidthCell = params.OptimallineWidthCell;
                            let s = strength < 0 ? Math.exp(-dn * dn / OptimallineWidthCell) : 1 - Math.exp(-distance);


                            if (strength < 0) if (col >= leftup.col && col <= rightdown.col || row >= leftup.row && row <= rightdown.row) s = s * m;
                            let influence = strength * s;
                            this.field[row][col] += influence;
                            if (strength > 0) continue;
                            let xy2 = this.cellToCoord(col, row);
                            nodes.forEach((v, i) => {
                                if (v == obj) return;
                                if (v == co) return;

                                if (v.intersectsLine(objX, objY, xy2.x, xy2.y)) {

                                    this.field[row][col] += -strength;
                                    this.field[row][col] += Infinity;
                                }


                            });


                        }
                    }
                }

            }

            // Находим ячейку с минимальным потенциалом для размещения нового объекта
            findBestPosition(objWidth, objHeight) {
                let bestCol = Math.floor(this.cols / 2);
                let bestRow = Math.floor(this.rows / 2);
                let minPotential = Infinity;


                for (let x = 0; x <= this.cols; x++)
                    for (let y = this.rows; y >= 0; y--) {
                        const col = x - Math.ceil(0.5 * objWidth / this.cellSize);
                        const row = y - Math.ceil(0.5 * objHeight / this.cellSize);
                        const cr = col + Math.ceil(objWidth / this.cellSize);
                        const rr = row + Math.ceil(objHeight / this.cellSize);
                        if (col >= 0 && col < this.cols && row >= 0 && row < this.rows) {

                            // Проверяем, что объект поместится
                            if (cr <= this.cols &&
                                rr <= this.rows) {

                                const potential = this.getPotential(col, row, cr, rr);

                                if (potential < minPotential && potential != 0) {
                                    minPotential = potential;
                                    bestCol = x;
                                    bestRow = y;
                                }
                            }
                        }
                    }



                return this.cellToCoord(bestCol, bestRow);

    <script>

        // Простая нейросеть без внешних библиотек
        class SimpleNeuralNetwork {
            constructor(inputSize, hiddenSize, outputSize) {
                this.inputSize = inputSize;
                this.hiddenSize = hiddenSize;
                this.outputSize = outputSize;

                // Инициализация весов случайными значениями
                this.weights1 = this.initializeWeights(inputSize, hiddenSize);
                this.weights2 = this.initializeWeights(hiddenSize, outputSize);
                this.bias1 = new Array(hiddenSize).fill(0);
                this.bias2 = new Array(outputSize).fill(0);
            }

            initializeWeights(rows, cols) {
                const weights = [];
                const limit = Math.sqrt(6 / (rows + cols));
                for (let i = 0; i < rows; i++) {
                    weights[i] = [];
                    for (let j = 0; j < cols; j++) {
                        weights[i][j] = (Math.random() * 2 - 1) * limit;
                    }
                }
                return weights;
            }

            // Активационная функция ReLU
            relu(x) {
                return Math.max(0, x);
            }

            // Производная ReLU
            reluDerivative(x) {
                return x > 0 ? 1 : 0;
            }

            // Сигмоидная функция для выходного слоя
            sigmoid(x) {
                if (x > 700) return 1;
                if (x < -700) return 0;
                return 1 / (1 + Math.exp(-x));
            }

            sigmoidDerivative(x) {
                const sig = this.sigmoid(x);
                return sig * (1 - sig);
            }

            // Прямое распространение
            forward(input) {
                // Скрытый слой
                this.hidden = new Array(this.hiddenSize);
                for (let i = 0; i < this.hiddenSize; i++) {
                    let sum = this.bias1[i];
                    for (let j = 0; j < this.inputSize; j++) {
                        sum += input[j] * this.weights1[j][i];
                    }
                    this.hidden[i] = this.relu(sum);
                }

                // Выходной слой
                this.output = new Array(this.outputSize);
                for (let i = 0; i < this.outputSize; i++) {
                    let sum = this.bias2[i];
                    for (let j = 0; j < this.hiddenSize; j++) {
                        sum += this.hidden[j] * this.weights2[j][i];
                    }
                    this.output[i] = this.sigmoid(sum);
                }

                return this.output.slice();
            }

            // Обратное распространение
            backward(input, target, learningRate) {
                // Ошибка выходного слоя
                const outputErrors = new Array(this.outputSize);
                for (let i = 0; i < this.outputSize; i++) {
                    outputErrors[i] = target[i] - this.output[i];
                }

                // Градиенты выходного слоя
                const outputGradients = new Array(this.outputSize);
                for (let i = 0; i < this.outputSize; i++) {
                    outputGradients[i] = outputErrors[i] * this.sigmoidDerivative(this.output[i]);
                }

                // Обновление весов выходного слоя
                for (let i = 0; i < this.hiddenSize; i++) {
                    for (let j = 0; j < this.outputSize; j++) {
                        this.weights2[i][j] += learningRate * outputGradients[j] * this.hidden[i];
                    }
                }

                // Обновление смещений выходного слоя
                for (let i = 0; i < this.outputSize; i++) {
                    this.bias2[i] += learningRate * outputGradients[i];
                }

                // Ошибки скрытого слоя
                const hiddenErrors = new Array(this.hiddenSize);
                for (let i = 0; i < this.hiddenSize; i++) {
                    let error = 0;
                    for (let j = 0; j < this.outputSize; j++) {
                        error += outputGradients[j] * this.weights2[i][j];
                    }
                    hiddenErrors[i] = error;
                }

                // Градиенты скрытого слоя
                const hiddenGradients = new Array(this.hiddenSize);
                for (let i = 0; i < this.hiddenSize; i++) {
                    hiddenGradients[i] = hiddenErrors[i] * this.reluDerivative(this.hidden[i]);
                }

                // Обновление весов скрытого слоя
                for (let i = 0; i < this.inputSize; i++) {
                    for (let j = 0; j < this.hiddenSize; j++) {
                        this.weights1[i][j] += learningRate * hiddenGradients[j] * input[i];
                    }
                }

                // Обновление смещений скрытого слоя
                for (let i = 0; i < this.hiddenSize; i++) {
                    this.bias1[i] += learningRate * hiddenGradients[i];
                }
            }

            // Обучение на одном примере
            train(input, target, learningRate = 0.01) {
                this.forward(input);
                this.backward(input, target, learningRate);
            }

            // Сохранение модели
            save() {
                return {
                    weights1: this.weights1,
                    weights2: this.weights2,
                    bias1: this.bias1,
                    bias2: this.bias2,
                    inputSize: this.inputSize,
                    hiddenSize: this.hiddenSize,
                    outputSize: this.outputSize
                };
            }

            // Загрузка модели
            load(modelData) {
                this.weights1 = modelData.weights1;
                this.weights2 = modelData.weights2;
                this.bias1 = modelData.bias1;
                this.bias2 = modelData.bias2;
                this.inputSize = modelData.inputSize;
                this.hiddenSize = modelData.hiddenSize;
                this.outputSize = modelData.outputSize;
            }
        }

    <script>
        class GraphAnalyzer {
            static analyzeGraph(data) {
                // connectionMap: Map<nodeId, Set<connectedNodeIds>>
                const connectionMap = new Map();

                // Статистика по соединениям
                const incomingMap = new Map();  // сколько входящих соединений у каждого узла
                const outgoingMap = new Map();  // сколько исходящих соединений у каждого узла

                // Собираем все ID узлов
                const allNodeIds = new Set();

                // Добавляем контейнеры
                data.containers.forEach(container => {
                    allNodeIds.add(container.id);
                });

                // Добавляем грузы на складе
                data.goods.forEach(good => {
                    allNodeIds.add(good.id);
                });

                // Добавляем грузы внутри контейнеров
                data.containers.forEach(container => {
                    container.goods.forEach(good => {
                        allNodeIds.add(good.id);
                    });
                });

                // Инициализируем connectionMap для всех узлов
                allNodeIds.forEach(nodeId => {
                    connectionMap.set(nodeId, new Set());
                    incomingMap.set(nodeId, 0);
                    outgoingMap.set(nodeId, 0);
                });

                // Обрабатываем соединения
                data.joins.forEach(join => {
                    const fromId = join.from;
                    const toId = join.to;

                    // Проверяем, что оба узла существуют
                    if (allNodeIds.has(fromId) && allNodeIds.has(toId)) {
                        // Добавляем двунаправленную связь в connectionMap
                        connectionMap.get(fromId).add(toId);
                        connectionMap.get(toId).add(fromId);

                        // Обновляем статистику направленных соединений
                        outgoingMap.set(fromId, outgoingMap.get(fromId) + 1);
                        incomingMap.set(toId, incomingMap.get(toId) + 1);
                    }
                });

                // Рассчитываем статистику
                let maxDegree = 0;
                let maxInDegree = 0;
                let maxOutDegree = 0;
                let totalDegree = 0;
                let totalInDegree = 0;
                let totalOutDegree = 0;

                allNodeIds.forEach(nodeId => {
                    const degree = connectionMap.get(nodeId).size;
                    const inDegree = incomingMap.get(nodeId);
                    const outDegree = outgoingMap.get(nodeId);

                    maxDegree = Math.max(maxDegree, degree);
                    maxInDegree = Math.max(maxInDegree, inDegree);
                    maxOutDegree = Math.max(maxOutDegree, outDegree);

                    totalDegree += degree;
                    totalInDegree += inDegree;
                    totalOutDegree += outDegree;
                });

                const totalObjects = allNodeIds.size;
                const avgDegree = totalObjects > 0 ? totalDegree / totalObjects : 0;
                const avgInDegree = totalObjects > 0 ? totalInDegree / totalObjects : 0;
                const avgOutDegree = totalObjects > 0 ? totalOutDegree / totalObjects : 0;

                return {
                    // Основные структуры данных
                    connectionMap,      // Map<nodeId, Set<connectedNodeIds>> - неориентированный граф
                    incomingMap,        // Map<nodeId, number> - количество входящих соединений
                    outgoingMap,        // Map<nodeId, number> - количество исходящих соединений
                    allNodeIds,         // Set<nodeId> - все ID узлов в графе

                    // Статистика
                    totalObjects,
                    maxDegree,          // максимальная степень узла (общее количество связей)
                    maxInDegree,        // максимальное количество входящих связей
                    maxOutDegree,       // максимальное количество исходящих связей
                    avgDegree,          // средняя степень узла
                    avgInDegree,        // среднее количество входящих связей
                    avgOutDegree,       // среднее количество исходящих связей

                    // Исходные данные для reference
                    joins: data.joins,
                    containers: data.containers,
                    goods: data.goods
                };
            }

            // Вспомогательный метод для получения всех объектов как массива
            static getAllObjects(data) {
                const allObjects = [];

                // Добавляем контейнеры
                data.containers.forEach(container => {
                    allObjects.push({
                        id: container.id,
                        type: 'container',
                        data: container
                    });
                });

                // Добавляем грузы на складе
                data.goods.forEach(good => {
                    allObjects.push({
                        id: good.id,
                        type: 'warehouse_good',
                        data: good
                    });
                });

                // Добавляем грузы внутри контейнеров (если нужно для анализа)
                data.containers.forEach(container => {
                    container.goods.forEach(good => {
                        allObjects.push({
                            id: good.id,
                            type: 'container_good',
                            data: good,
                            containerId: container.id
                        });
                    });
                });

                return allObjects;
            }
        }
